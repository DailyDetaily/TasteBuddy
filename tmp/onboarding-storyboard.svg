<svg width="860" height="1280" viewBox="0 0 860 1280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="860" y2="1280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6F2ED"/>
      <stop offset="1" stop-color="#F8F8F8"/>
    </linearGradient>
    <radialGradient id="hero1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 170) rotate(90) scale(200 200)">
      <stop stop-color="#FFF0D8"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </radialGradient>
    <radialGradient id="hero2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 170) rotate(90) scale(200 200)">
      <stop stop-color="#FFF6CF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </radialGradient>
    <radialGradient id="hero3" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 170) rotate(90) scale(200 200)">
      <stop stop-color="#E7F1FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </radialGradient>
    <radialGradient id="hero4" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 170) rotate(90) scale(200 200)">
      <stop stop-color="#F1E5F1"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#0F0F0F" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="860" height="1280" rx="40" fill="url(#bg)"/>
  <text x="60" y="72" fill="#0F0F0F" font-size="30" font-weight="700" font-family="Pretendard, Arial, sans-serif">
    Updated Onboarding Preview
  </text>
  <text x="60" y="104" fill="#666666" font-size="18" font-weight="500" font-family="Pretendard, Arial, sans-serif">
    Hardware-first framing removed. Personalized dining story introduced.
  </text>

  <g transform="translate(60 150)" filter="url(#shadow)">
    <rect width="320" height="500" rx="34" fill="#FFFFFF"/>
    <rect x="26" y="26" width="268" height="214" rx="28" fill="url(#hero1)" stroke="#F4ECE3"/>
    <circle cx="160" cy="104" r="56" fill="#FFFFFF" fill-opacity="0.72"/>
    <circle cx="118" cy="162" r="34" fill="#FFCC80" fill-opacity="0.45"/>
    <circle cx="200" cy="170" r="42" fill="#FFB84D" fill-opacity="0.24"/>
    <rect x="96" y="264" width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E7E7E7"/>
    <text x="160" y="283" text-anchor="middle" fill="#535353" font-size="11" font-weight="700" letter-spacing="2" font-family="Pretendard, Arial, sans-serif">PERSONALIZED DINING</text>
    <text x="40" y="334" fill="#0F0F0F" font-size="28" font-weight="700" font-family="Pretendard, Arial, sans-serif">더 잘 맞는 다이닝을</text>
    <text x="40" y="370" fill="#0F0F0F" font-size="28" font-weight="700" font-family="Pretendard, Arial, sans-serif">시작해보세요</text>
    <text x="40" y="414" fill="#535353" font-size="16" font-weight="500" font-family="Pretendard, Arial, sans-serif">Taste Buddy는 현재의 입맛을 이해해,</text>
    <text x="40" y="440" fill="#535353" font-size="16" font-weight="500" font-family="Pretendard, Arial, sans-serif">더 잘 맞는 다이닝 경험으로 이어주는</text>
    <text x="40" y="466" fill="#535353" font-size="16" font-weight="500" font-family="Pretendard, Arial, sans-serif">개인화 서비스입니다.</text>
    <circle cx="145" cy="514" r="4" fill="#0F0F0F"/>
    <circle cx="159" cy="514" r="4" fill="#E5E5E5"/>
    <circle cx="173" cy="514" r="4" fill="#E5E5E5"/>
    <circle cx="187" cy="514" r="4" fill="#E5E5E5"/>
    <rect x="40" y="540" width="240" height="48" rx="12" fill="#0F0F0F"/>
    <text x="160" y="570" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="600" font-family="Pretendard, Arial, sans-serif">계속하기</text>
  </g>

  <g transform="translate(480 150)" filter="url(#shadow)">
    <rect width="320" height="500" rx="34" fill="#FFFFFF"/>
    <rect x="26" y="26" width="268" height="214" rx="28" fill="url(#hero2)" stroke="#F0E8BF"/>
    <rect x="72" y="72" width="176" height="120" rx="24" fill="#FFFFFF" fill-opacity="0.72"/>
    <rect x="92" y="98" width="136" height="16" rx="8" fill="#FF9900" fill-opacity="0.18"/>
    <rect x="92" y="126" width="118" height="16" rx="8" fill="#FBC02D" fill-opacity="0.25"/>
    <rect x="92" y="154" width="144" height="16" rx="8" fill="#7299FF" fill-opacity="0.18"/>
    <rect x="100" y="264" width="120" height="28" rx="14" fill="#FFFFFF" stroke="#E7E7E7"/>
    <text x="160" y="283" text-anchor="middle" fill="#535353" font-size="11" font-weight="700" letter-spacing="2" font-family="Pretendard, Arial, sans-serif">CURRENT PROFILE</text>
    <text x="40" y="334" fill="#0F0F0F" font-size="28" font-weight="700" font-family="Pretendard, Arial, sans-serif">짧고 가벼운 시작으로</text>
    <text x="40" y="370" fill="#0F0F0F" font-size="28" font-weight="700" font-family="Pretendard, Arial, sans-serif">현재 프로필을 만듭니다</text>
    <text x="40" y="414" fill="#535353" font-size="16" font-weight="500" font-family="Pretendard, Arial, sans-serif">복잡한 설정 없이 지금의 미각 경향을 정리해,</text>
    <text x="40" y="440" fill="#535353" font-size="16" font-weight="500" font-family="Pretendard, Arial, sans-serif">첫 예약부터 바로 활용할 수 있는</text>
    <text x="40" y="466" fill="#535353" font-size="16" font-weight="500" font-family="Pretendard, Arial, sans-serif">현재 프로필을 만듭니다.</text>
    <circle cx="145" cy="514" r="4" fill="#E5E5E5"/>
    <circle cx="159" cy="514" r="4" fill="#0F0F0F"/>
    <circle cx="173" cy="514" r="4" fill="#E5E5E5"/>
    <circle cx="187" cy="514" r="4" fill="#E5E5E5"/>
    <rect x="40" y="540" width="240" height="48" rx="12" fill="#0F0F0F"/>
    <text x="160" y="570" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="600" font-family="Pretendard, Arial, sans-serif">계속하기</text>
  </g>

  <g transform="translate(60 700)" filter="url(#shadow)">
    <rect width="320" height="500" rx="34" fill="#FFFFFF"/>
    <rect x="26" y="26" width="268" height="214" rx="28" fill="url(#hero3)" stroke="#DAE6F5"/>
    <path d="M88 176C116 144 148 130 182 124C210 118 234 108 248 90" stroke="#7299FF" stroke-width="10" stroke-linecap="round" opacity="0.28"/>
    <path d="M88 170C112 146 138 136 166 132C198 128 220 114 240 86" stroke="#0F0F0F" stroke-width="3" stroke-linecap="round"/>
    <circle cx="88" cy="170" r="7" fill="#FF9900"/>
    <circle cx="166" cy="132" r="7" fill="#7299FF"/>
    <circle cx="240" cy="86" r="7" fill="#B372B4"/>
    <rect x="86" y="264" width="148" height="28" rx="14" fill="#FFFFFF" stroke="#E7E7E7"/>
    <text x="160" y="283" text-anchor="middle" fill="#535353" font-size="11" font-weight="700" letter-spacing="2" font-family="Pretendard, Arial, sans-serif">CHEF-READY GUIDANCE</text>
    <text x="40" y="334" fill="#0F0F0F" font-size="28" font-weight="700" font-family="Pretendard, Arial, sans-serif">프로필은 예약에 맞춰</text>
    <text x="40" y="370" fill="#0F0F0F" font-size="28" font-weight="700" font-family="Pretendard, Arial, sans-serif">더 실용적으로 전달됩니다</text>
    <text x="40" y="414" fill="#535353" font-size="16" font-weight="500" font-family="Pretendard, Arial, sans-serif">당신의 현재 프로필은 셰프가 의도를 해치지</text>
    <text x="40" y="440" fill="#535353" font-size="16" font-weight="500" font-family="Pretendard, Arial, sans-serif">않으면서도 더 잘 맞는 경험을 준비할 수</text>
    <text x="40" y="466" fill="#535353" font-size="16" font-weight="500" font-family="Pretendard, Arial, sans-serif">있도록 정리됩니다.</text>
    <circle cx="145" cy="514" r="4" fill="#E5E5E5"/>
    <circle cx="159" cy="514" r="4" fill="#E5E5E5"/>
    <circle cx="173" cy="514" r="4" fill="#0F0F0F"/>
    <circle cx="187" cy="514" r="4" fill="#E5E5E5"/>
    <rect x="40" y="540" width="240" height="48" rx="12" fill="#0F0F0F"/>
    <text x="160" y="570" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="600" font-family="Pretendard, Arial, sans-serif">계속하기</text>
  </g>

  <g transform="translate(480 700)" filter="url(#shadow)">
    <rect width="320" height="500" rx="34" fill="#FFFFFF"/>
    <rect x="26" y="26" width="268" height="214" rx="28" fill="url(#hero4)" stroke="#E6D8E6"/>
    <circle cx="120" cy="124" r="46" fill="#FFFFFF" fill-opacity="0.8"/>
    <circle cx="208" cy="110" r="38" fill="#FFFFFF" fill-opacity="0.72"/>
    <circle cx="158" cy="178" r="54" fill="#FFFFFF" fill-opacity="0.66"/>
    <path d="M104 126C120 108 136 100 150 100C166 100 180 108 194 126" stroke="#B372B4" stroke-width="3" stroke-linecap="round"/>
    <path d="M120 164C136 154 148 150 160 150C174 150 188 156 204 170" stroke="#7299FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M94 188C116 174 142 168 166 170C188 172 208 180 224 194" stroke="#FF9900" stroke-width="3" stroke-linecap="round"/>
    <rect x="86" y="264" width="148" height="28" rx="14" fill="#FFFFFF" stroke="#E7E7E7"/>
    <text x="160" y="283" text-anchor="middle" fill="#535353" font-size="11" font-weight="700" letter-spacing="2" font-family="Pretendard, Arial, sans-serif">REFINED OVER TIME</text>
    <text x="40" y="334" fill="#0F0F0F" font-size="28" font-weight="700" font-family="Pretendard, Arial, sans-serif">프로필은 식사와 피드백을 통해</text>
    <text x="40" y="370" fill="#0F0F0F" font-size="28" font-weight="700" font-family="Pretendard, Arial, sans-serif">조금씩 더 정교해집니다</text>
    <text x="40" y="414" fill="#535353" font-size="16" font-weight="500" font-family="Pretendard, Arial, sans-serif">예약, 식후 피드백, 다시 찾은 선택이 쌓일수록</text>
    <text x="40" y="440" fill="#535353" font-size="16" font-weight="500" font-family="Pretendard, Arial, sans-serif">다음 다이닝은 더 자연스럽고</text>
    <text x="40" y="466" fill="#535353" font-size="16" font-weight="500" font-family="Pretendard, Arial, sans-serif">섬세하게 맞춰집니다.</text>
    <circle cx="145" cy="514" r="4" fill="#E5E5E5"/>
    <circle cx="159" cy="514" r="4" fill="#E5E5E5"/>
    <circle cx="173" cy="514" r="4" fill="#E5E5E5"/>
    <circle cx="187" cy="514" r="4" fill="#0F0F0F"/>
    <rect x="40" y="540" width="240" height="48" rx="12" fill="#0F0F0F"/>
    <text x="160" y="570" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="600" font-family="Pretendard, Arial, sans-serif">프로필 시작하기</text>
  </g>
</svg>
