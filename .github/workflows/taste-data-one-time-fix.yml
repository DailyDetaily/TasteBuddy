name: Taste Data One-Time Compiler Fix
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/gastronomy-data-five-categories-20260915' && github.actor == 'DailyDetaily'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Apply exact preconditioned source replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('ios/TasteBuddy/Features/Home/HomeSummaryComponents.swift')
          actual = subprocess.check_output(['git', 'hash-object', str(p)], text=True).strip()
          if actual != '53b56662f731bbbe4deb261c044e47017e53f506':
              print('Source has moved; refusing to patch another revision.')
              raise SystemExit(0)
          s = p.read_text()
          def replace(old, new, count=1):
              global s
              if s.count(old) != count:
                  raise RuntimeError('Patch precondition failed: ' + old[:100])
              s = s.replace(old, new)
          replace('''            let rows = groups.map { identity, entries in
                          TDRow(id: identity.id, title: identity.label, value: "\\(meals(entries))번의 식사",
                                amount: Double(meals(entries)), entryIDs: ids(entries))
                      }.sorted { $0.amount == $1.amount ? $0.id < $1.id : ($0.amount ?? 0) > ($1.amount ?? 0) }'''.replace('                          ', '                ').replace('                                ', '                      ').replace('                      }.sorted', '            }.sorted'), '''            var rows: [TDRow] = []
                      for (identity, records) in groups {
                          let count: Int = meals(records)
                          let row = TDRow(id: identity.id, title: identity.label,
                                          value: "\\(count)번의 식사", amount: Double(count), entryIDs: ids(records))
                          rows.append(row)
                      }
                      rows.sort { (left: TDRow, right: TDRow) -> Bool in
                          let a = left.amount ?? 0, b = right.amount ?? 0
                          return a == b ? left.id < right.id : a > b
                      }'''.replace('\n                      ', '\n            '))
          replace('''        let unique = grouped.keys.sorted().compactMap { id -> TDRecord? in''', '''        var unique = grouped.keys.sorted().compactMap { id -> TDRecord? in''')
          replace('''        var unknown = Set<String>(), future = Set<String>(), valid: [TDRecord] = []''', '''        let conflictMeals = Set(records.filter { conflicts.contains($0.id) }.map(\\.mealID))
                  unique = unique.filter { row in
                      if conflictMeals.contains(row.mealID) { conflicts.insert(row.id); return false }
                      return true
                  }
                  var unknown = Set<String>(), future = Set<String>(), valid: [TDRecord] = []'''.replace('\n                  ', '\n        '))
          replace('''        return "식감"
              }
          }
          struct TDWindow'''.replace('              }', '    }').replace('          }', '}').replace('          struct', 'struct'), '''        if attribute.hasPrefix("texture.") || attribute.hasPrefix("mouthfeel.") { return "식감" }
              return "기타"
          }
          }
          struct TDWindow'''.replace('              return', '        return').replace('          }', '    }', 1).replace('          }', '}', 1).replace('          struct', 'struct'))
          replace('ForEach(["맛", "향", "식감"], id:', 'ForEach(["맛", "향", "식감", "기타"], id:')
          replace('''    private var renderKey: TDRenderKey {''', '''    private var effectivePeriod: TDPeriodChoice { category == .change && period == .all ? .ninety : period }
              private var renderKey: TDRenderKey {'''.replace('\n              ', '\n    '))
          replace('period: period.window(now: referenceDate, calendar: calendar)', 'period: effectivePeriod.window(now: referenceDate, calendar: calendar)')
          replace('Picker("측정 기간", selection: $period)', 'Picker("측정 기간", selection: Binding(get: { effectivePeriod }, set: { period = $0 }))')
          replace('ForEach(TDPeriodChoice.allCases) { Text($0.rawValue).tag($0) }', 'ForEach(TDPeriodChoice.allCases.filter { category != .change || $0 != .all }) { Text($0.rawValue).tag($0) }')
          replace('''        let nonzero = segments.filter { $0.count > 0 }''', '''        let nonzero = segments // Stable shade positions, including zero-count response categories.''')
          p.write_text(s)
          print('Applied bounded replacements to HomeSummaryComponents.swift only.')
          PY
      - name: Verify production core before committing
        run: python3 ios/Tools/validate-taste-data.py
      - name: Commit only the approved file without force push
        shell: bash
        run: |
          set -euo pipefail
          file=ios/TasteBuddy/Features/Home/HomeSummaryComponents.swift
          if git diff --quiet -- "$file"; then exit 0; fi
          git config user.name 'TasteBuddy validation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$file"
          git commit -m 'fix(ios): simplify Swift inference and keep data scopes explicit'
          git push origin HEAD:refs/heads/feat/gastronomy-data-five-categories-20260915
