name: TasteBuddy

options:
  bundleIdPrefix: com.tastebuddy
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.6"

settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_WARN_BOOL_CONVERSION: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
    CURRENT_PROJECT_VERSION: 1
    ENABLE_STRICT_OBJC_MSGSEND: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_NO_COMMON_BLOCKS: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    MARKETING_VERSION: 0.1.0
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_VERSION: "5.10"
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  ProgressiveBlurHeader:
    url: https://github.com/dominikmartn/ProgressiveBlurHeader
    branch: main
  VariableBlur:
    url: https://github.com/nikstar/VariableBlur
    branch: main
  supabase-swift:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.46.0

targets:
  TasteBuddy:
    type: application
    platform: iOS
    sources:
      - path: TasteBuddy
        excludes:
          - Resources/Info.plist
    resources:
      - path: TasteBuddy/Resources
        excludes:
          - Info.plist
    info:
      path: TasteBuddy/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: ko
        CFBundleDisplayName: Taste Buddy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSApplicationQueriesSchemes:
          - instagram-stories
        CFBundleURLTypes:
          - CFBundleURLName: com.tastebuddy.ios.auth
            CFBundleURLSchemes:
              - tastebuddy
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPhotoLibraryAddUsageDescription: 결과 카드 이미지를 사진 보관함에 저장하기 위해 사용합니다.
        UIAppFonts:
          - Pretendard-Regular.otf
          - Pretendard-Medium.otf
          - Pretendard-SemiBold.otf
          - Pretendard-Bold.otf
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        TBBackendEnvironment: $(TB_BACKEND_ENVIRONMENT)
        TBChatGPTEntryURL: $(TB_CHATGPT_ENTRY_URL)
        TBAuthRedirectURL: $(TB_AUTH_REDIRECT_URL)
        TBGoogleMapsAPIKey: $(TB_GOOGLE_MAPS_API_KEY)
        TBInstagramFacebookAppID: $(TB_INSTAGRAM_FACEBOOK_APP_ID)
        TBKakaoRestAPIKey: $(TB_KAKAO_REST_API_KEY)
        TBPublicMediaBaseURL: $(TB_PUBLIC_MEDIA_BASE_URL)
        TBSupabasePublishableKey: $(TB_SUPABASE_PUBLISHABLE_KEY)
        TBSupabaseURL: $(TB_SUPABASE_URL)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CLANG_ENABLE_OBJC_WEAK: YES
        CODE_SIGN_STYLE: Automatic
        DEFINES_MODULE: YES
        DEVELOPMENT_TEAM: U7QNRP437U
        ENABLE_MODULE_VERIFIER: YES
        ENABLE_TESTABILITY: YES
        MODULE_VERIFIER_SUPPORTED_LANGUAGE_STANDARDS: "gnu17 gnu++14"
        PRODUCT_BUNDLE_IDENTIFIER: com.juneh96.tastebuddy.ios
        PRODUCT_NAME: TasteBuddy
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: ProgressiveBlurHeader
      - package: VariableBlur
      - package: supabase-swift
        product: Supabase

  TasteBuddyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TasteBuddyTests
    dependencies:
      - target: TasteBuddy
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        CLANG_ENABLE_OBJC_WEAK: YES
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tastebuddy.ios.tests
        PRODUCT_NAME: TasteBuddyTests
        SWIFT_VERSION: "5.10"

schemes:
  TasteBuddy:
    build:
      targets:
        TasteBuddy: all
        TasteBuddyTests:
          - test
    test:
      targets:
        - TasteBuddyTests
