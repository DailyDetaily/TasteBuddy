name: TasteBuddy

options:
  bundleIdPrefix: com.tastebuddy
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    SWIFT_VERSION: "5.10"

packages:
  supabase-swift:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.46.0

targets:
  TasteBuddy:
    type: application
    platform: iOS
    sources:
      - path: TasteBuddy
        excludes:
          - Resources/Info.plist
    resources:
      - path: TasteBuddy/Resources
        excludes:
          - Info.plist
    info:
      path: TasteBuddy/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: ko
        CFBundleDisplayName: Taste Buddy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSApplicationQueriesSchemes:
          - instagram-stories
        CFBundleURLTypes:
          - CFBundleURLName: com.tastebuddy.ios.auth
            CFBundleURLSchemes:
              - tastebuddy
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPhotoLibraryAddUsageDescription: 결과 카드 이미지를 사진 보관함에 저장하기 위해 사용합니다.
        UIAppFonts:
          - Pretendard-Regular.otf
          - Pretendard-Medium.otf
          - Pretendard-SemiBold.otf
          - Pretendard-Bold.otf
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        TBBackendEnvironment: $(TB_BACKEND_ENVIRONMENT)
        TBAuthRedirectURL: $(TB_AUTH_REDIRECT_URL)
        TBGoogleMapsAPIKey: $(TB_GOOGLE_MAPS_API_KEY)
        TBInstagramFacebookAppID: $(TB_INSTAGRAM_FACEBOOK_APP_ID)
        TBKakaoRestAPIKey: $(TB_KAKAO_REST_API_KEY)
        TBPublicMediaBaseURL: $(TB_PUBLIC_MEDIA_BASE_URL)
        TBSupabasePublishableKey: $(TB_SUPABASE_PUBLISHABLE_KEY)
        TBSupabaseURL: $(TB_SUPABASE_URL)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEFINES_MODULE: YES
        ENABLE_TESTABILITY: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tastebuddy.ios
        PRODUCT_NAME: TasteBuddy
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: supabase-swift
        product: Supabase

  TasteBuddyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TasteBuddyTests
    dependencies:
      - target: TasteBuddy
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tastebuddy.ios.tests
        PRODUCT_NAME: TasteBuddyTests
        SWIFT_VERSION: "5.10"

schemes:
  TasteBuddy:
    build:
      targets:
        TasteBuddy: all
        TasteBuddyTests:
          - test
    test:
      targets:
        - TasteBuddyTests
